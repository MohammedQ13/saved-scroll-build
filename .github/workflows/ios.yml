name: ios
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: "Use Xcode 26 (iOS 26 SDK for App Intents supportedModes)"
        run: sudo xcode-select -s /Applications/Xcode_26.3.app && xcodebuild -version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/engine
      - name: Build the engine for iPhone
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          cd app/engine
          SDKROOT="$SDK" IPHONEOS_DEPLOYMENT_TARGET=17.0 cargo build --release --target aarch64-apple-ios --features refresh
      - name: Build the app (unsigned IPA)
        run: |
          mkdir -p app/ios/lib
          cp app/engine/target/aarch64-apple-ios/release/libssengine.a app/ios/lib/
          brew install xcodegen >/dev/null
          cd app/ios
          xcodegen generate
          xcodebuild -project SavedScrollEngine.xcodeproj -scheme SavedScrollEngine -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -25
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry SavedScroll.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: saved-scroll-app
          path: app/ios/SavedScroll.ipa
